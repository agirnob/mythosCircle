[project]
name = "mythoscircle-backend"
version = "0.1.0"
description = "mythosCircle backend — FastAPI substrate: world store, queue, inference"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141,<0.142",
    "pydantic>=2.13,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.52,<1",
    "python-ulid>=4,<5",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "httpx>=0.28,<1",
    "ruff>=0.16,<0.17",
    "mypy>=2,<3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I", # isort
    "UP", # pyupgrade
    "B", # flake8-bugbear
    "SIM", # flake8-simplify
    "C4", # flake8-comprehensions
]

[tool.mypy]
files = ["app", "tests"]
python_version = "3.12"
strict = true
