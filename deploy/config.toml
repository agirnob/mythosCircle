# mythosCircle runtime configuration — installed at /etc/mythoscircle/config.toml.
#
# NO SECRETS HERE (AD-22): secrets are environment variables only
# (see the systemd unit's EnvironmentFile). Everything below is
# non-sensitive operator configuration.

[server]
host = "127.0.0.1"
port = 8000
# Public origin (matches the Caddyfile).
base_url = "https://world.example.tld"

[world]
data_dir = "/var/lib/mythoscircle"
sqlite_path = "/var/lib/mythoscircle/mythoscircle.db"
media_dir = "/var/lib/mythoscircle/media"
# Structured JSON-lines log (conventions.md).
log_file = "/var/log/mythoscircle/app.jsonl"

[llm]
# OpenAI-compatible endpoint (AD-14): local llama-server at MVP.
# Switching to any OpenAI-compatible server (e.g. OpenRouter) is a
# config change; the key, if any, is an environment variable.
endpoint = "http://127.0.0.1:8080/v1"
model = "mythos-14b-q5"
# HTTP timeout for one chat-completion call (seconds). Local llama-server
# generating full AR24 profiles decodes 5-6k tokens; at ~55 tok/s that is
# ~2min of decode alone — the 120s default aborted mid-generation
# (client disconnect -> provider connection error, 2026-09-04).
timeout = 900
# Per-job LLM/media call budgets are declared per job and capped here.
max_llm_calls_per_job = 64
max_media_calls_per_job = 8

[image]
# OpenAI-compatible image endpoint (spec-4.1). PLACEHOLDER DEFAULTS — the
# dev image server + model choice is a pending owner decision (ask-first
# item); until confirmed these are inert and portrait tests inject a mock
# provider. The key, if any, is an environment variable
# (MYTHOSCIRCLE_IMAGE_API_KEY).
endpoint = "http://127.0.0.1:8081/v1"
model = "mythos-portrait-v1"
# HTTP timeout for one images/generations call (seconds).
timeout = 120
# Backend switch (spec-4.4): "openai" (default — spec-4.1 behavior
# preserved) or "comfyui" (opt-in alternative local-dev backend; the
# [comfyui_image] section below is what the comfyui path reads). Static
# config, no runtime fallback chain.
backend = "openai"

[comfyui_image]
# ComfyUI portrait backend (spec-4.4). ASK-FIRST: the Krea2 Turbo T2I
# workflow file lives on the operator machine
# (/home/main/Desktop/image_krea2_turbo_t2i_int8 (2).json) — default
# plan is to DOCUMENT the path only and NOT ship the workflow JSON (it
# references operator-specific model weights by node id; the provider
# reloads it from disk on every call). Reopen if the owner wants it
# shipped in deploy/.
endpoint = "http://127.0.0.1:7896"
# Absolute path to the operator's Krea2 Turbo workflow JSON. Empty
# default is a documented placeholder: the job fails at first call
# (provider connection error) until the operator fills this in.
workflow_path = ""
# The workflow node whose inputs.value carries the prompt text (Krea2
# Turbo: the "Text String (User Prompt)" widget — node 30:19, NOT the
# 30:28 switch). Operator-specific; must match the workflow JSON.
prompt_node_id = "30:19"
# Documented generation shape — fixed per workflow, no per-job knobs
# (one job = one image).
aspect_ratio = "1:1 (Square)"
megapixels = 1.0
# Timeout bounds the ENTIRE ComfyUI call (submit + poll + fetch), not
# just the submit. Krea2 Turbo on a local GPU is 30-90s typical.
timeout = 1800

[video]
# OpenAI-compatible video endpoint (spec-4.2, beta). PLACEHOLDER DEFAULTS —
# the dev video server + model choice is a pending owner decision
# (ask-first item); until confirmed these are inert and reveal-video
# tests inject a mock provider. The key, if any, is an environment
# variable (MYTHOSCIRCLE_VIDEO_API_KEY).
endpoint = "http://127.0.0.1:8082/v1"
model = "mythos-reveal-v1"
# HTTP timeout for one videos/generations call (seconds).
timeout = 120

[queue]
# One persistent FIFO; exactly one job at a time (AD-3). The pending cap
# (in-flight + queued, AR28) — consumed by the runtime as
# MYTHOSCIRCLE_MAX_PENDING_PER_CAMPAIGN's config default (spec-1.7).
max_in_flight_per_campaign = 1

[campaigns]
# Seed theme list (AD-24); operators can extend per campaign.
themes = ["High Fantasy", "Grimdark", "Steampunk", "Planar"]
