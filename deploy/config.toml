# mythosCircle runtime configuration — installed at /etc/mythoscircle/config.toml.
#
# NO SECRETS HERE (AD-22): secrets are environment variables only
# (see the systemd unit's EnvironmentFile). Everything below is
# non-sensitive operator configuration.

[server]
host = "127.0.0.1"
port = 8000
# Public origin: the Cloudflare edge (what browsers and Forge fetch —
# TLS terminates at the edge). Must match the tunnel's public hostname;
# the Caddyfile origin behind the tunnel is plain HTTP over loopback.
base_url = "https://world.miscco.uk"

[world]
data_dir = "/var/lib/mythoscircle"
sqlite_path = "/var/lib/mythoscircle/mythoscircle.db"
media_dir = "/var/lib/mythoscircle/media"
# Structured JSON-lines log (conventions.md).
log_file = "/var/log/mythoscircle/app.jsonl"

[llm]
# OpenAI-compatible endpoint (AD-14): local llama-server at MVP.
# Switching to any OpenAI-compatible server (e.g. OpenRouter) is a
# config change; the key, if any, is an environment variable.
endpoint = "http://127.0.0.1:8080/v1"
model = "mythos-14b-q5"
# HTTP timeout for one chat-completion call (seconds). Local llama-server
# generating full AR24 profiles decodes 5-6k tokens; at ~55 tok/s that is
# ~2min of decode alone — the 120s default aborted mid-generation
# (client disconnect -> provider connection error, 2026-09-04).
timeout = 900
# Hard ceiling on ONE completion's generated tokens — a backstop against
# generation that never terminates, not the guard against a reasoning model
# rambling (that is `thinking` below, which stops the channel outright).
# Sized well above any real output: a 14-character build-in wave is ~3k
# tokens, and the dev model holds 262k context. Truncation is reported as
# its own error, never a downstream JSON parse failure.
max_tokens = 65536
# Tri-state reasoning control (enable_thinking) for the local chat template:
# false = answers immediately (~200 tok/s, 7x faster than thinking on),
# true = ask for the thinking channel, <absent> = send no such field at all
# (some backends reject unknown request fields). Measured 2026-09-10.
thinking = false
# Sampling controls (optional; env MYTHOSCIRCLE_LLM_TEMPERATURE /
# MYTHOSCIRCLE_LLM_TOP_P / MYTHOSCIRCLE_LLM_SEED override). Absent =
# the request body omits the field entirely, so the server's own default
# rules and a backend rejecting unknown fields keeps working (the
# `thinking` tri-state's rationale). Set them to pin reproducible
# sampling: temperature = 0.0 is greedy decoding, seed fixes the RNG.
# temperature = 0.7
# top_p = 0.9
# seed = 12345
# Per-job LLM/media call budgets are declared per job and capped here.
max_llm_calls_per_job = 64
max_media_calls_per_job = 8

[image]
# OpenAI-compatible image endpoint (spec-4.1). PLACEHOLDER DEFAULTS — the
# dev image server + model choice is a pending owner decision (ask-first
# item); until confirmed these are inert and portrait tests inject a mock
# provider. The key, if any, is an environment variable
# (MYTHOSCIRCLE_IMAGE_API_KEY).
endpoint = "http://127.0.0.1:8081/v1"
model = "mythos-portrait-v1"
# HTTP timeout for one images/generations call (seconds).
timeout = 120
# Backend switch (spec-4.4): "openai" (default — spec-4.1 behavior
# preserved) or "comfyui" (opt-in alternative local-dev backend; the
# [comfyui_image] section below is what the comfyui path reads). Static
# config, no runtime fallback chain.
backend = "openai"

[comfyui_image]
# ComfyUI portrait backend (spec-4.4; repo-home decision, spec-4.5 Ask
# First: None): the Krea2 Turbo T2I workflow JSON lives in the REPO at
# deploy/workflows/image_krea2_turbo_t2i_int8 (2).json — the repo is
# the single home (spec-4.5 Never list) and the provider reloads it
# from disk on every call.
endpoint = "http://127.0.0.1:7896"
# Path to the Krea2 Turbo workflow JSON, RELATIVE to this config file's
# directory (deploy/workflows/… — the JSONs ship in the repo, so the
# relative form is machine-independent across checkouts; an operator
# installing the config elsewhere sets an absolute path instead).
workflow_path = "workflows/image_krea2_turbo_t2i_int8 (2).json"
# The workflow node whose inputs.value carries the prompt text (Krea2
# Turbo: the "Text String (User Prompt)" widget — node 30:19, NOT the
# 30:28 switch). Operator-specific; must match the workflow JSON.
prompt_node_id = "30:19"
# Documented generation shape — fixed per workflow, no per-job knobs
# (one job = one image).
aspect_ratio = "1:1 (Square)"
megapixels = 1.0
# Timeout bounds the ENTIRE ComfyUI call (submit + poll + fetch), not
# just the submit. Krea2 Turbo on a local GPU is 30-90s typical.
timeout = 1800

[video]
# OpenAI-compatible video endpoint (spec-4.2, beta). PLACEHOLDER DEFAULTS —
# the dev video server + model choice is a pending owner decision
# (ask-first item); until confirmed these are inert and reveal-video
# tests inject a mock provider. The key, if any, is an environment
# variable (MYTHOSCIRCLE_VIDEO_API_KEY).
endpoint = "http://127.0.0.1:8082/v1"
model = "mythos-reveal-v1"
# HTTP timeout for one videos/generations call (seconds).
timeout = 120
# Backend switch (spec-4.5): "openai" (default — spec-4.2 behavior
# preserved) or "comfyui" (opt-in alternative local-dev backend; the
# [comfyui_video] section below is what the comfyui path reads). Static
# config, no runtime fallback chain.
backend = "openai"

[comfyui_video]
# ComfyUI reveal-video backend (spec-4.5): the MiniMax H3 image-to-video
# workflow. The workflow JSON lives in the REPO at
# deploy/workflows/video_minimax_h3_i2v_sage.json (the repo is the
# single home — spec-4.5 Never list) and is reloaded from disk on every
# call; endpoint/timeout configure the ComfyUI server itself.
endpoint = "http://127.0.0.1:7896"
# Path to the MiniMax i2v workflow JSON, RELATIVE to this config file's
# directory (deploy/workflows/… — the JSONs ship in the repo, so the
# relative form is machine-independent across checkouts; an operator
# installing the config elsewhere sets an absolute path instead).
workflow_path = "workflows/video_minimax_h3_i2v_sage.json"
# The workflow node whose inputs.prompt carries the reveal prompt text —
# the MiniMax H3 Image-to-Video node (105:104), NOT a text-encode
# node's inputs.value (that is the image workflow's widget). Must match
# the workflow JSON.
prompt_node_id = "105:104"
# The workflow node whose inputs.image names the source frame — the
# LoadImage node (114). The provider stages the entity's portrait into
# ComfyUI's input dir and sets this to the staged filename.
first_frame_node_id = "114"
# Absolute path to ComfyUI's input directory (LoadImage reads from
# HERE, never the media dir). Empty default is a documented
# placeholder: the job fails at first call (provider connection error)
# until the operator points this at the ComfyUI install's input/.
input_dir = ""
# Timeout bounds the ENTIRE ComfyUI call (submit + poll + fetch).
# An 11s MiniMax H3 clip renders in ~1-2 min on a local GPU — the
# default comfortably exceeds the render time (spec-4.5 Verification).
timeout = 1800

[queue]
# One persistent FIFO; exactly one job at a time (AD-3). The pending cap
# (in-flight + queued, AR28) — consumed by the runtime as
# MYTHOSCIRCLE_MAX_PENDING_PER_CAMPAIGN's config default (spec-1.7).
max_in_flight_per_campaign = 1

[campaigns]
# Seed theme list (AD-24); operators can extend per campaign.
themes = ["High Fantasy", "Grimdark", "Steampunk", "Planar"]
