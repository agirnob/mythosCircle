# Web sidecar: static SPA + /api reverse proxy (Docker flow).
# NPM sends EVERYTHING here (one proxy host, websockets ON) — no per-path
# locations in NPM. /api covers the REST surface AND the /api/ws/jobs
# socket (spec: ws lives under /api, so one prefix suffices).
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream api {
  server api:8000;
}

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Generate jobs run for minutes; the WS idles between frames.
    proxy_read_timeout 3600s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
