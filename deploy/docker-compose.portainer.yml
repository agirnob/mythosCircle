# mythosCircle Portainer stack (web-editor variant for the 192.168.1.21 laptop).
# Paste this into Portainer -> Stacks -> Add stack -> Web editor.
#
# Unlike deploy/docker-compose.yml (which BUILDS from the repo and needs a
# git-backed stack), this variant references PREBUILT images: load them on
# the laptop first with
#   docker load -i mythos-images.tgz
# (built on the dev PC via the Dockerfiles in deploy/docker/). Keep the
# services, env names, and volume below in sync with docker-compose.yml.
#
# Traffic: existing Cloudflare tunnel -> NPM (plain HTTP) -> web:8081.
# NPM proxy host: world.miscco.uk -> http://192.168.1.21:8081, websockets
# ON, no custom locations, no SSL cert. The sidecar proxies /api/* to api.
# No cloudflared service here: the laptop's existing tunnel already
# terminates to NPM — the dashboard only needs the world.miscco.uk
# ingress pointed at NPM's HTTP port.
#
# Stack env (Portainer "Environment variables", AD-22 — never in git):
#   MYTHOSCIRCLE_MEDIA_URL_SECRET=<openssl rand -hex 32>  (REQUIRED: mint 500s without it)
name: mythoscircle

services:
  api:
    image: mythoscircle-api:local
    pull_policy: never
    restart: unless-stopped
    # AD-3 single writer: NEVER scale past 1 replica.
    ports:
      # Laptop-local debug only (Portainer holds host :8000).
      - "127.0.0.1:8001:8000"
    environment:
      MYTHOSCIRCLE_DB: sqlite:////data/mythoscircle.db
      MYTHOSCIRCLE_MEDIA_DIR: /data/media
      MYTHOSCIRCLE_LOG_FILE: /data/logs/app.jsonl
      MYTHOSCIRCLE_BASE_URL: https://world.miscco.uk
      # spec-6-4 (AR14): the origin behind the TLS edge serves plain HTTP
      # and never learns the public scheme, so the Secure flag is declared
      # explicitly (AD-22, env-only; unset keeps the dev plain-http flow).
      MYTHOSCIRCLE_COOKIE_SECURE: "true"
      MYTHOSCIRCLE_MEDIA_URL_SECRET: ${MYTHOSCIRCLE_MEDIA_URL_SECRET:?MYTHOSCIRCLE_MEDIA_URL_SECRET is required}
      # LLM lives on the dev PC (Unsloth Studio); the laptop reaches it
      # over the LAN. Requires one /v1/load per Unsloth restart.
      # Reverse tunnel (mythos-gpu-tunnel on .108): .108 loopback services
      # surface on laptop LAN ports (.108 itself is firewall-filtered).
      MYTHOSCIRCLE_LLM_ENDPOINT: http://192.168.1.21:8889/v1
      MYTHOSCIRCLE_LLM_MODEL: unsloth/gemma-4-12B-it-qat-GGUF
      MYTHOSCIRCLE_LLM_TIMEOUT: "2400"
      # Unsloth demands Bearer off-loopback; key comes from stack env
      # (required — fail closed like the media secret).
      MYTHOSCIRCLE_LLM_API_KEY: ${MYTHOSCIRCLE_LLM_API_KEY:?MYTHOSCIRCLE_LLM_API_KEY is required}
      # Render backends live on the dev PC (.108), not the laptop: Unsloth
      # + ComfyUI bind loopback there; the reverse tunnel surfaces them on
      # laptop ports (see LLM note above).
      # input_dir stays UNSET (default ""): video RENDER fails fast
      # cross-machine (local-copy staging can't reach the .108 input dir)
      # while drafts + portraits work; upload-based staging is queued work.
      MYTHOSCIRCLE_IMAGE_BACKEND: comfyui
      MYTHOSCIRCLE_COMFYUI_IMAGE_ENDPOINT: http://192.168.1.21:7897
      MYTHOSCIRCLE_VIDEO_BACKEND: comfyui
      MYTHOSCIRCLE_COMFYUI_VIDEO_ENDPOINT: http://192.168.1.21:7897
    volumes:
      - mythos-data:/data

  web:
    image: mythoscircle-web:local
    pull_policy: never
    restart: unless-stopped
    ports:
      # NPM's single upstream for world.miscco.uk (qbittorrent holds :8080).
      - "8081:80"
    depends_on:
      - api

volumes:
  mythos-data:
